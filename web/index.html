<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boat Dashboard</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 128 128'%3E%3Crect x='6' y='6' width='116' height='116' rx='26' fill='%230b1620'/%3E%3Cg fill='none' stroke='%23e6eef5' stroke-width='8' stroke-linecap='round'%3E%3Ccircle cx='64' cy='32' r='8'/%3E%3Cpath d='M64 40v54M46 52h36M30 74c4 14 18 24 34 24s30-10 34-24'/%3E%3C/g%3E%3C/svg%3E">
<style>
  :root {
    --bg:#0b1620; --card:#132433; --card2:#0f1e2b; --line:#ffffff14; --fg:#e6eef5; --dim:#8aa0b4;
    --ok:#3ecf8e; --warn:#f5b942; --bad:#ef5b5b; --accent:#4aa3ff; --sun:#ffc94a; --alt:#b48cff;
    --r:12px; --gap:16px;
  }
  body.night {
    --bg:#000; --card:#140000; --card2:#0c0000; --line:#ff505022; --fg:#ff5050; --dim:#a03030;
    --ok:#ff5050; --warn:#ff5050; --bad:#ff2020; --accent:#ff5050; --sun:#ff5050; --alt:#ff5050;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
         -webkit-font-smoothing:antialiased; transition:background .3s, color .3s; }
  header { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:12px; padding:12px 16px;
           background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  header h1 { font-size:17px; font-weight:600; margin:0; flex:1; letter-spacing:.01em; }
  #conn { font-size:12px; color:var(--dim); display:flex; align-items:center; gap:6px; }
  #conn::before { content:""; width:8px; height:8px; border-radius:50%; background:var(--dim); }
  #conn.live::before { background:var(--ok); box-shadow:0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
  button.icon { background:var(--card); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:6px 10px; font:inherit; cursor:pointer; }
  main { padding:var(--gap); max-width:1400px; margin:0 auto; }
  h2.section { font-size:12px; font-weight:600; color:var(--dim); text-transform:uppercase; letter-spacing:.12em; margin:8px 2px 10px; }
  .grid { display:grid; gap:var(--gap); grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); margin-bottom:24px; }

  /* Power flow strip */
  .flow { display:grid; grid-template-columns:repeat(auto-fit, minmax(150px, 1fr)); margin-bottom:var(--gap);
          background:var(--card); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; }
  .flow > div { padding:14px 16px; box-shadow:-1px 0 0 var(--line), 0 -1px 0 var(--line); }
  .flow .l { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; display:flex; align-items:center; gap:6px; }
  .flow .v { font-size:26px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:4px; }
  .flow .s { font-size:12px; color:var(--dim); margin-top:2px; }
  .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }

  /* Cards */
  .card { background:var(--card); border-radius:var(--r); padding:16px; border:1px solid var(--line); transition:opacity .4s; }
  .card.stale { opacity:.55; }
  .card h3 { margin:0 0 2px; font-size:16px; font-weight:600; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .card .model { font-size:12px; color:var(--dim); margin-bottom:14px; }
  .chip { font-size:11px; font-weight:600; padding:3px 8px; border-radius:999px; background:var(--card2); border:1px solid var(--line); white-space:nowrap; }
  .chip.ok { color:var(--ok); } .chip.warn { color:var(--warn); } .chip.bad { color:var(--bad); } .chip.dim { color:var(--dim); } .chip.idle { color:var(--accent); }
  .hero { display:flex; align-items:baseline; gap:6px; margin-bottom:4px; }
  .hero .big { font-size:42px; font-weight:650; font-variant-numeric:tabular-nums; letter-spacing:-.01em; }
  .hero .unit { color:var(--dim); font-size:16px; }
  .bar { height:8px; background:var(--card2); border-radius:4px; overflow:hidden; margin:8px 0 14px; }
  .bar > div { height:100%; background:var(--ok); transition:width .6s ease; }
  .metrics { display:grid; grid-template-columns:repeat(3, 1fr); gap:12px 10px; }
  .m .l { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; }
  .m .v { font-size:18px; font-variant-numeric:tabular-nums; margin-top:2px; }
  .cells { display:flex; gap:6px; margin-top:14px; }
  .cell { flex:1; text-align:center; background:var(--card2); border-radius:6px; padding:6px 2px; font-size:13px; font-variant-numeric:tabular-nums; }
  .cell.lo { outline:1px solid var(--warn); } .cell.hi { outline:1px solid var(--accent); }
  .note { margin-top:12px; font-size:12px; color:var(--dim); }
  .alert { margin-top:12px; color:var(--bad); font-weight:600; font-size:13px; }
  .chg { color:var(--ok); } .dis { color:var(--warn); }

  /* Charger on/off switch (PWR-4, Bluetooth VE.Smart) */
  .control { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:16px; padding-top:14px; border-top:1px solid var(--line); }
  .control .txt { font-size:13px; } .control .sub { font-size:12px; color:var(--dim); }
  .switch { position:relative; width:52px; height:30px; border-radius:15px; background:var(--card2); border:1px solid var(--line); flex:none; }
  .switch::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:var(--dim); transition:transform .25s; }
  .switch.on { background:color-mix(in srgb, var(--ok) 35%, var(--card2)); }
  .switch.on::after { transform:translateX(22px); background:var(--ok); }
  .switch[aria-disabled="true"] { opacity:.5; cursor:not-allowed; }
  button.switch { padding:0; cursor:pointer; font:inherit; -webkit-tap-highlight-color:transparent; }
  button.switch:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
  /* touch target ≥ 44 px without changing the look */
  button.switch::before { content:""; position:absolute; inset:-8px -6px; }
  .switch.pending::after { background:transparent; border:2px solid var(--dim); border-top-color:var(--accent);
                           width:18px; height:18px; animation:spin .8s linear infinite; }
  .switch.pending.on::after { transform:translateX(22px); }
  @keyframes spin { to { rotate:360deg; } }
  .control .sub.warn { color:var(--warn); } .control .sub.bad { color:var(--bad); }

  /* Confirmation sheet */
  dialog#confirm { border:1px solid var(--line); border-radius:16px; background:var(--card); color:var(--fg);
                   padding:22px; width:min(360px, calc(100vw - 32px)); box-shadow:0 20px 60px #0008; }
  dialog#confirm::backdrop { background:#0009; backdrop-filter:blur(2px); }
  dialog#confirm h4 { margin:0 0 8px; font-size:17px; }
  dialog#confirm p { margin:0 0 20px; color:var(--dim); font-size:14px; }
  dialog#confirm .row { display:flex; gap:10px; justify-content:flex-end; }
  dialog#confirm button { font:inherit; font-weight:600; border-radius:10px; padding:10px 16px; min-height:44px;
                          border:1px solid var(--line); background:var(--card2); color:var(--fg); cursor:pointer; }
  dialog#confirm button.go { background:var(--accent); border-color:transparent; color:#fff; }
  dialog#confirm button.go.off { background:var(--warn); color:#1a1200; }
  body.night dialog#confirm button.go { background:#5a0000; color:var(--fg); }

  @media (max-width:420px) { .metrics { grid-template-columns:repeat(2, 1fr); } .hero .big { font-size:36px; } }
  @media (prefers-reduced-motion:reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<header>
  <h1>⚓ Tableau de bord</h1>
  <span id="conn">connexion…</span>
  <button class="icon" id="night" title="Mode nuit" aria-label="Mode nuit">🌙</button>
</header>
<main>
  <h2 class="section">Énergie</h2>
  <div id="flow"></div>
  <div class="grid" id="energy"></div>
  <h2 class="section">Batteries</h2>
  <div class="grid" id="batteries"></div>
</main>
<dialog id="confirm" aria-labelledby="confirm-title">
  <h4 id="confirm-title"></h4>
  <p id="confirm-text"></p>
  <div class="row"><button id="confirm-no" type="button">Annuler</button><button id="confirm-go" class="go" type="button"></button></div>
</dialog>
<script>
const $ = (s) => document.querySelector(s);
const num = (v) => typeof v === "number" && isFinite(v);
const fmt = (v, d = 1, u = "") => num(v) ? `${v.toFixed(d)}${u}` : "—";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const STALE_S = 30;
const isStale = (updated) => !updated || Date.now() / 1000 - updated > STALE_S;

const STATE_FR = {
  off: "Arrêt", low_power: "Basse conso.", fault: "Défaut", bulk: "Bulk", absorption: "Absorption",
  float: "Float", storage: "Stockage", equalize_manual: "Égalisation", inverting: "Onduleur",
  power_supply: "Alimentation", starting_up: "Démarrage", repeated_absorption: "Absorption",
  recondition: "Reconditionnement", battery_safe: "Batterie sûre", external_control: "Contrôle externe",
};
const OFF_FR = {
  no_input_power: "pas de tension d'entrée", switched_off_switch: "interrupteur",
  switched_off_register: "arrêté par réglage", remote_input: "entrée remote (moteur arrêté)",
  protection_active: "protection active", engine_shutdown: "moteur arrêté",
  analysing_input_voltage: "analyse de la tension d'entrée", bms: "coupé par le BMS",
};
// Off for a normal reason (night, engine stopped) = standby, not a fault or a lost link.
const idleReason = (d) => {
  const v = d.values;
  if (v.state !== "off") return null;
  if (d.kind === "solar" && d.control?.mode === "off") return null;
  if (d.kind === "solar" && !(v.pv_power > 0)) return "Pas de soleil — reprend tout seul au lever du jour.";
  if (d.kind === "orion" && ["remote_input", "engine_shutdown"].includes(v.off_reason))
    return "Moteur arrêté — se met en marche avec le moteur.";
  return null;
};
const stateLabel = (d) => d.control?.mode === "off" ? "Coupé"
  : idleReason(d) ? "En veille" : (STATE_FR[d.values.state] ?? "—");
const stateChip = (st, stale, idle = false) => {
  if (stale) return `<span class="chip dim">hors ligne</span>`;
  if (!st) return `<span class="chip dim">—</span>`;
  if (idle) return `<span class="chip idle">En veille</span>`;
  const cls = st === "fault" ? "bad" : st === "off" ? "dim" : "ok";
  return `<span class="chip ${cls}">${esc(STATE_FR[st] ?? st)}</span>`;
};
const errLine = (e) => e && e !== "no_error" ? `<div class="alert">⚠ Erreur : ${esc(e.replaceAll("_", " "))}</div>` : "";
const metric = (l, v, cls = "") => `<div class="m"><div class="l">${l}</div><div class="v ${cls}">${v}</div></div>`;
const hm = (mins) => num(mins) ? `${Math.floor(mins / 60)} h ${String(Math.round(mins % 60)).padStart(2, "0")}` : "—";

function solarCard(d) {
  const v = d.values, stale = isStale(d.updated), cut = d.control?.mode === "off";
  const chip = cut && !stale ? `<span class="chip warn">Coupé</span>` : stateChip(v.state, stale, !!idleReason(d));
  return `<div class="card ${stale ? "stale" : ""}">
    <h3>☀️ Solaire ${chip}</h3>
    <div class="model">${esc(d.model ?? d.name)}</div>
    <div class="hero"><span class="big">${num(v.pv_power) ? v.pv_power : "—"}</span><span class="unit">W panneaux</span></div>
    <div class="metrics" style="margin-top:12px">
      ${metric("Charge", fmt(v.battery_current, 1, " A"), "chg")}
      ${metric("Tension", fmt(v.battery_voltage, 2, " V"))}
      ${metric("Aujourd'hui", num(v.yield_today_wh) ? (v.yield_today_wh >= 1000 ? fmt(v.yield_today_wh / 1000, 2, " kWh") : `${v.yield_today_wh} Wh`) : "—")}
    </div>
    ${!stale && idleReason(d) ? `<div class="note">${idleReason(d)}</div>` : ""}
    ${errLine(v.error)}
    ${chargerControl(d)}
  </div>`;
}

// ---- Solar charger on/off (POST /api/victron/{name}/charger) --------------------------------
const ui = { pending: {}, error: {} };  // per device: command in flight / last local failure
const ERR_FR = {
  unreachable: "Chargeur injoignable — réessayez dans un instant.",
  refused: "Refusé par le chargeur.",
  busy: "Une commande est déjà en cours.",
  network: "Pas de connexion au tableau de bord.",
};
function chargerControl(d) {
  const c = d.control;
  if (!c) return `<div class="control"><div><div class="txt">Chargeur solaire</div>
      <div class="sub">Contrôle indisponible — code PIN Bluetooth non configuré</div></div>
      <div class="switch" role="switch" aria-disabled="true"></div></div>`;
  const pending = ui.pending[d.name] ?? null;  // target of our own command: true = on
  const on = pending !== null ? pending : c.mode === "on";
  const err = ui.error[d.name] ?? c.error;
  let sub, cls = "";
  if (pending !== null) sub = pending ? "Allumage… (confirmation du chargeur)" : "Arrêt… (confirmation du chargeur)";
  else if (c.busy) sub = "Communication avec le chargeur…";
  else if (err) { sub = ERR_FR[err] ?? err; cls = "bad"; }
  else if (c.mode === "on") sub = "Les panneaux chargent les batteries quand il y a du soleil.";
  else if (c.mode === "off") { sub = "Coupé — les panneaux ne chargent pas."; cls = "warn"; }
  else sub = "Lecture de l'état…";
  const disabled = pending !== null || c.busy || !c.mode;
  return `<div class="control">
      <div><div class="txt">Chargeur solaire</div><div class="sub ${cls}" aria-live="polite">${esc(sub)}</div></div>
      <button class="switch ${on ? "on" : ""} ${pending !== null ? "pending" : ""}" role="switch" aria-checked="${on}"
        aria-label="Chargeur solaire" ${disabled ? `aria-disabled="true"` : ""} data-charger="${esc(d.name)}" data-on="${on}"></button>
    </div>`;
}

function confirmSwitch(turnOn) {
  const dlg = $("#confirm");
  $("#confirm-title").textContent = turnOn ? "Allumer le chargeur solaire ?" : "Couper le chargeur solaire ?";
  $("#confirm-text").textContent = turnOn
    ? "Les panneaux recommenceront à charger les batteries."
    : "Les panneaux ne chargeront plus les batteries jusqu'à ce que vous le rallumiez.";
  const go = $("#confirm-go");
  go.textContent = turnOn ? "Allumer" : "Couper";
  go.classList.toggle("off", !turnOn);
  return new Promise((resolve) => {
    const done = (ok) => { dlg.close(); go.onclick = $("#confirm-no").onclick = dlg.oncancel = null; resolve(ok); };
    go.onclick = () => done(true);
    $("#confirm-no").onclick = () => done(false);
    dlg.oncancel = () => done(false);
    dlg.showModal();
    $("#confirm-no").focus();  // safe default
  });
}

async function onSwitch(btn) {
  if (btn.getAttribute("aria-disabled") === "true") return;
  const name = btn.dataset.charger, turnOn = btn.dataset.on !== "true";
  if (!(await confirmSwitch(turnOn))) return;
  ui.pending[name] = turnOn; delete ui.error[name]; rerender();
  try {
    const r = await fetch(`/api/victron/${encodeURIComponent(name)}/charger`, {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ on: turnOn }),
    });
    if (r.ok) {  // apply the confirmed mode now; the next push says the same (no flicker)
      const dev = lastData?.victron?.find(x => x.name === name);
      if (dev?.control) dev.control = { ...dev.control, mode: (await r.json()).mode, error: null, busy: false };
    } else ui.error[name] = r.status === 409 ? "busy" : ((await r.json().catch(() => ({}))).detail ?? "unreachable");
  } catch { ui.error[name] = "network"; }
  delete ui.pending[name]; rerender();
  if (ui.error[name]) setTimeout(() => { delete ui.error[name]; rerender(); }, 8000);
}
document.addEventListener("click", (e) => { const b = e.target.closest("[data-charger]"); if (b) onSwitch(b); });

function bmvCard(d) {
  const v = d.values, stale = isStale(d.updated);
  const alarm = v.alarm && v.alarm !== "no_alarm" ? `<div class="alert">⚠ Alarme : ${esc(v.alarm.replaceAll("_", " "))}</div>` : "";
  const socColor = !num(v.soc) ? "" : v.soc < 20 ? "var(--bad)" : v.soc < 40 ? "var(--warn)" : "var(--ok)";
  return `<div class="card ${stale ? "stale" : ""}">
    <h3>🔋 Moniteur de banc ${stale ? stateChip(null, true) : `<span class="chip ok">en direct</span>`}</h3>
    <div class="model">${esc(d.model ?? d.name)}</div>
    <div class="hero"><span class="big">${num(v.soc) ? Math.round(v.soc) : "—"}</span><span class="unit">%</span></div>
    <div class="bar"><div style="width:${num(v.soc) ? v.soc : 0}%;background:${socColor}"></div></div>
    <div class="metrics">
      ${metric("Tension", fmt(v.voltage, 2, " V"))}
      ${metric("Courant", fmt(v.current, 1, " A"), (v.current ?? 0) >= 0 ? "chg" : "dis")}
      ${metric("Puissance", fmt(v.power, 0, " W"))}
      ${metric("Consommé", fmt(v.consumed_ah, 1, " Ah"))}
      ${metric("Autonomie", hm(v.remaining_mins))}
      ${metric("Démarrage", fmt(v.starter_voltage, 2, " V"))}
    </div>
    ${!num(v.soc) && !stale ? `<div class="note">État de charge non synchronisé : le BMV l'apprendra à la prochaine charge complète.</div>` : ""}
    ${alarm}
  </div>`;
}

function orionCard(d) {
  const v = d.values, stale = isStale(d.updated);
  const idle = idleReason(d);
  const why = idle && !stale ? `<div class="note">${idle}</div>`
    : v.state === "off" && v.off_reason && v.off_reason !== "no_reason"
    ? `<div class="note">À l'arrêt : ${esc(OFF_FR[v.off_reason] ?? v.off_reason.replaceAll("_", " "))}</div>` : "";
  return `<div class="card ${stale ? "stale" : ""}">
    <h3>⚙️ Alternateur ${stateChip(v.state, stale, !!idle)}</h3>
    <div class="model">${esc(d.name)} · chargeur DC-DC</div>
    <div class="hero"><span class="big">${num(v.output_power) ? Math.round(v.output_power) : "—"}</span><span class="unit">W vers le banc</span></div>
    <div class="metrics" style="margin-top:12px">
      ${metric("Entrée", fmt(v.input_voltage, 2, " V"))}
      ${metric("Sortie", fmt(v.output_voltage, 2, " V"))}
      ${metric("Courant", fmt(v.output_current, 1, " A"), "chg")}
    </div>
    ${why}${errLine(v.error)}
  </div>`;
}

function keyCard(d) {
  return `<div class="card"><h3>${esc(d.name)} <span class="chip warn">clé manquante</span></h3>
    <div class="note">Ajouter la clé de lecture instantanée dans ~/.config/boatdash/victron-keys.json</div></div>`;
}

function flowStrip(vic, bats) {
  const dev = (k) => vic.find(d => d.kind === k && !isStale(d.updated));
  const lbl = (k) => dev(k) ? stateLabel(dev(k)) : "—";
  const by = (k) => dev(k)?.values ?? {};
  const s = by("solar"), o = by("orion"), b = by("bmv");
  const solarW = s.charge_power, altW = o.output_power, netW = b.power;
  const loadW = num(netW) ? (solarW ?? 0) + (altW ?? 0) - netW : null;
  const live = bats.filter(x => num(x.soc));
  const soc = num(b.soc) ? b.soc : live.length ? live.reduce((a, x) => a + x.soc * x.capacity_ah, 0) / live.reduce((a, x) => a + x.capacity_ah, 0) : null;
  const socSrc = num(b.soc) ? "BMV" : live.length ? "moyenne BMS" : "";
  return `<div class="flow">
    <div><div class="l"><span class="dot" style="background:var(--sun)"></span>Solaire</div><div class="v">${fmt(solarW, 0, " W")}</div><div class="s">${esc(lbl("solar"))}</div></div>
    <div><div class="l"><span class="dot" style="background:var(--alt)"></span>Alternateur</div><div class="v">${fmt(altW, 0, " W")}</div><div class="s">${esc(lbl("orion"))}</div></div>
    <div><div class="l"><span class="dot" style="background:var(--warn)"></span>Consommation</div><div class="v">${fmt(loadW, 0, " W")}</div><div class="s">bord</div></div>
    <div><div class="l"><span class="dot" style="background:var(--accent)"></span>Banc</div><div class="v ${(netW ?? 0) >= 0 ? "chg" : "dis"}">${fmt(netW, 0, " W")}</div><div class="s">${num(b.current) ? fmt(b.current, 1, " A") : "—"} · ${fmt(b.voltage, 2, " V")}</div></div>
    <div><div class="l"><span class="dot" style="background:var(--ok)"></span>État de charge</div><div class="v">${num(soc) ? Math.round(soc) + " %" : "—"}</div><div class="s">${socSrc}</div></div>
  </div>`;
}

function timeLeft(b) {
  if (b.current == null || Math.abs(b.current) < 0.2) return "—";
  const ah = b.current < 0 ? b.remaining_ah : b.capacity_ah - b.remaining_ah;
  return hm(ah / Math.abs(b.current) * 60);
}

function batteryCard(b) {
  const stale = isStale(b.updated);
  const status = b.connected && !stale ? `<span class="chip ok">connecté</span>` : `<span class="chip dim">${b.updated ? "hors ligne" : "connexion…"}</span>`;
  const socColor = b.soc == null ? "" : b.soc < 20 ? "var(--bad)" : b.soc < 40 ? "var(--warn)" : "var(--ok)";
  const cells = b.cells.map(c => `<div class="cell ${c === b.cell_min && b.cell_delta_mv > 20 ? "lo" : ""}${c === b.cell_max && b.cell_delta_mv > 20 ? "hi" : ""}">${c.toFixed(3)}</div>`).join("");
  const alerts = [...b.protections];
  if (b.charge_enabled === false) alerts.push("charge désactivée");
  if (b.discharge_enabled === false) alerts.push("décharge désactivée");
  return `<div class="card ${stale && b.updated ? "stale" : ""}">
    <h3>${esc(b.name)} ${status}</h3>
    <div class="model">LiFePO4 · ${fmt(b.capacity_ah, 0, " Ah")} · ${b.cycles ?? "—"} cycles</div>
    <div class="hero"><span class="big">${b.soc ?? "—"}</span><span class="unit">%</span></div>
    <div class="bar"><div style="width:${b.soc ?? 0}%;background:${socColor}"></div></div>
    <div class="metrics">
      ${metric("Tension", fmt(b.voltage, 2, " V"))}
      ${metric("Courant", fmt(b.current, 2, " A"), (b.current ?? 0) >= 0 ? "chg" : "dis")}
      ${metric("Puissance", fmt(b.power, 0, " W"))}
      ${metric("Restant", fmt(b.remaining_ah, 1, " Ah"))}
      ${metric((b.current ?? 0) >= 0 ? "Plein dans" : "Autonomie", timeLeft(b))}
      ${metric("Temp.", b.temperatures.length ? b.temperatures.map(t => t.toFixed(1)).join(" / ") + " °C" : "—")}
    </div>
    <div class="cells">${cells}</div>
    <div class="note">Écart cellules : ${b.cell_delta_mv ?? "—"} mV</div>
    ${alerts.length ? `<div class="alert">⚠ ${alerts.map(esc).join(", ")}</div>` : ""}
  </div>`;
}

const CARD = { solar: solarCard, bmv: bmvCard, orion: orionCard };
const ORDER = { solar: 0, orion: 1, bmv: 2 };
let lastFlow = "", lastEnergy = "", lastBatteries = "";

let lastData = null;
const rerender = () => lastData && render(lastData);
function render(data) {
  lastData = data;
  const vic = [...(data.victron ?? [])].sort((a, b) => ORDER[a.kind] - ORDER[b.kind]);
  const flow = flowStrip(vic, data.batteries);
  const energy = vic.map(d => d.error === "missing_key" ? keyCard(d) : CARD[d.kind](d)).join("");
  const batteries = data.batteries.map(batteryCard).join("");
  // Only touch the DOM when something actually changed.
  if (flow !== lastFlow) { $("#flow").innerHTML = flow; lastFlow = flow; }
  if (energy !== lastEnergy) { $("#energy").innerHTML = energy; lastEnergy = energy; }
  if (batteries !== lastBatteries) { $("#batteries").innerHTML = batteries; lastBatteries = batteries; }
}

try { if (localStorage.night === "1") document.body.classList.add("night"); } catch {}
$("#night").onclick = () => {
  const on = document.body.classList.toggle("night");
  try { localStorage.night = on ? "1" : "0"; } catch {}
};

function connect() {
  const ws = new WebSocket(`${location.protocol === "https:" ? "wss" : "ws"}://${location.host}/ws`);
  ws.onopen = () => { $("#conn").textContent = "en direct"; $("#conn").classList.add("live"); };
  ws.onmessage = (e) => render(JSON.parse(e.data));
  ws.onclose = () => { $("#conn").textContent = "reconnexion…"; $("#conn").classList.remove("live"); setTimeout(connect, 2000); };
}
connect();
</script>
