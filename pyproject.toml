[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "boatdash"
version = "0.1.0"
description = "Onboard boat dashboard: batteries, navigation, NMEA 2000, charts"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
  "bleak>=1.0",
  "victron-ble>=0.9.3,<0.10",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "cbor2>=5.6",
  "dbus-fast>=2.0; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.setuptools.packages.find]
include = ["boatdash*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PERF"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
packages = ["boatdash"]

[[tool.mypy.overrides]]
module = ["bleak.*", "victron_ble.*"]
ignore_missing_imports = true

[tool.coverage.run]
# D-Bus glue that only runs against a real BlueZ daemon; the protocol around it is tested.
omit = ["boatdash/bluez_agent.py"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=boatdash --cov-report=term-missing --cov-fail-under=80"
